<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Global City Tours and Travels logo">
  <title>Global City Tours and Travels Pvt. Ltd.</title>
  <defs>
    <linearGradient id="gcBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a6b"/><stop offset="55%" stop-color="#0f62c6"/><stop offset="100%" stop-color="#2aa3ef"/>
    </linearGradient>
    <linearGradient id="gcGreenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b7a38"/><stop offset="100%" stop-color="#3ecf4a"/>
    </linearGradient>
    <linearGradient id="gcTailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62c6"/><stop offset="60%" stop-color="#1e90e0"/><stop offset="100%" stop-color="#2aa3ef"/>
    </linearGradient>
    <clipPath id="gcGlobeClip"><circle cx="100" cy="95" r="52"/></clipPath>
  </defs>

  <g transform="translate(0 -14)">
    <!-- green swoosh -->
    <path d="M20 143 C 30 190, 104 212, 172 176 C 112 197, 46 190, 20 143 Z" fill="url(#gcGreenGrad)"/>
    <!-- the C -->
    <path d="M158.97 53.7 A72 72 0 1 0 158.97 136.3 L142.6 124.8 A52 52 0 1 1 142.6 65.2 Z" fill="url(#gcBlueGrad)"/>
    <!-- globe -->
    <circle cx="100" cy="95" r="52" fill="#f2f8ff"/>
    <g clip-path="url(#gcGlobeClip)" fill="#0f62c6" opacity=".92">
      <path d="M64 62 C 76 54, 92 56, 96 64 C 100 72, 88 76, 82 74 C 74 82, 64 76, 64 68 Z"/>
      <path d="M84 82 C 94 78, 104 82, 106 90 C 108 100, 100 106, 96 118 C 92 130, 84 132, 82 124 C 80 114, 86 106, 82 96 Z"/>
      <path d="M112 60 C 126 56, 140 62, 142 70 C 143 78, 132 78, 128 74 C 120 80, 110 74, 110 68 Z"/>
      <path d="M118 88 C 130 84, 142 92, 140 102 C 138 110, 128 108, 126 100 C 122 96, 116 94, 118 88 Z"/>
      <path d="M118 118 C 128 114, 136 120, 132 126 C 128 132, 118 130, 118 124 Z"/>
    </g>
    <g clip-path="url(#gcGlobeClip)" fill="none" stroke="#9cc8f0" stroke-width="1.6" opacity=".85">
      <ellipse cx="100" cy="95" rx="52" ry="20"/>
      <ellipse cx="100" cy="95" rx="52" ry="40"/>
      <ellipse cx="100" cy="95" rx="20" ry="52"/>
      <ellipse cx="100" cy="95" rx="40" ry="52"/>
      <line x1="48" y1="95" x2="152" y2="95"/>
      <line x1="100" y1="43" x2="100" y2="147"/>
    </g>
    <circle cx="100" cy="95" r="52" fill="none" stroke="#0f62c6" stroke-width="3" opacity=".55"/>
    <!-- flight tail -->
    <path d="M36 152 C 96 130, 142 92, 188 42 C 193 37, 200 40, 197 47 C 152 98, 100 134, 44 162 Z" fill="url(#gcTailGrad)"/>
    <g transform="translate(196 30) rotate(-46) scale(2.6) translate(-12 -12)">
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#0a2a6b"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Poppins, Arial, sans-serif" text-anchor="middle">
    <text x="120" y="234" font-size="46" font-weight="800" letter-spacing="1">
      <tspan fill="#0a3a86">GLOBAL</tspan><tspan fill="#1fae4a"> CITY</tspan>
    </text>
    <text x="120" y="254" font-size="13.5" font-weight="600" letter-spacing="3.4" fill="#0f62c6">TOURS AND TRAVELS PVT.LTD.</text>
  </g>
  <rect x="8" y="246" width="52" height="3" rx="1.5" fill="#0f62c6"/>
  <rect x="180" y="246" width="52" height="3" rx="1.5" fill="#0f62c6"/>
</svg>
